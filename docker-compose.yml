services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    command: --innodb_buffer_pool_size=64M --max_connections=30
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    restart: no
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      timeout: 20s
      retries: 10
      interval: 10s  # 더 자주 체크
      start_period: 40s

  app:
    image: dnjsxo0616/runrush-app:latest  # build 대신 image 사용
    container_name: spring-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - runrush.env  # .env 대신 runrush.env
    command: [ "java", "-Xmx512m", "-Xms256m", "-jar", "app.jar" ]
    networks:
      - app-network
    restart: no

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
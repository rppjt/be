name: Build and Deploy to EC2 via Docker Hub

on:
  push:
    branches: [ deploy ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/runrush-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/runrush-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # 프로젝트 폴더가 없으면 clone, 있으면 pull
            if [ ! -d "/home/ubuntu/runrush" ]; then
              cd /home/ubuntu
              git clone https://github.com/your-github-username/your-repo-name.git runrush
            else
              cd /home/ubuntu/runrush
              git pull origin main
            fi
            
            cd /home/ubuntu/runrush
            
            # 최신 이미지 pull
            docker pull ${{ secrets.DOCKER_USERNAME }}/runrush-app:latest
            
            # .env 파일 생성 (GitHub Secrets에서)
            cat > .env << 'EOF'
            ${{ secrets.ENV_VARS }}
            EOF
            
            # 기존 컨테이너 중지 및 새로 시작
            docker compose down
            docker compose up -d
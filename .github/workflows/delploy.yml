name: Deploy to EC2

on:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. GitHub 소스 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ 2. JDK 설정 (필요 시)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ 3. gradlew 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # ✅ 4. Docker Hub 로그인 및 이미지 푸시
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/runrush-app:latest

      # ✅ 5. docker-compose.yml 파일을 EC2로 복사
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          source: docker-compose.yml
          target: "~/"

      # ✅ 6. .env 파일도 EC2에 복사 (Secrets를 직접 넣기)
      - name: Create .env on EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cat > ~/runrush.env << 'EOF'
            ${{ secrets.ENV_VARS }}
            EOF

      # ✅ 7. SSH로 EC2 접속해서 배포 실행
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd ~
            echo "🧹 Stopping existing containers..."
            docker compose --env-file runrush.env -f docker-compose.yml down || true
            docker system prune -f

            echo "⬇️ Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/runrush-app:latest

            echo "🚀 Starting containers..."
            docker compose --env-file runrush.env -f docker-compose.yml up -d

            echo "📄 Showing recent logs..."
            docker compose --env-file runrush.env -f docker-compose.yml logs --tail=50
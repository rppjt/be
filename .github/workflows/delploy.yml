name: Deploy to Production

on:
  push:
    branches: [ deploy ]

env:
  DOCKER_IMAGE_NAME: runrush-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Gradle (skip tests)
        run: ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # 환경변수 파일 생성
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # docker-compose.yml 파일 생성
            cat > docker-compose.yml << 'EOF'
            services:
              db:
                image: mysql:8.0
                container_name: db
                environment:
                  MYSQL_DATABASE: runrush_dev
                  MYSQL_USER: root
                  MYSQL_PASSWORD: ${DB_PASSWORD:-1234}
                  MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
                ports:
                  - "3306:3306"
                volumes:
                  - mysql_data:/var/lib/mysql
                restart: unless-stopped

              app:
                image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
                container_name: spring-app
                ports:
                  - "8080:8080"
                env_file:
                  - .env
                restart: unless-stopped

            volumes:
              mysql_data:
            EOF
            
            # 기존 서비스들 완전 정리 (포트 충돌 방지)
            docker-compose down || true
            docker stop $(docker ps -aq) || true
            docker rm $(docker ps -aq) || true
            
            # 최신 이미지 pull
            docker-compose pull app
            
            # 서비스들 시작 (백그라운드에서)
            docker-compose up -d
            
            # 배포 상태 확인
            echo "🚀 Starting services..."
            sleep 30
            
            # 서비스 상태 확인
            echo "📊 Container Status:"
            docker-compose ps
            
            # MySQL 연결 대기
            echo "⏳ Waiting for MySQL..."
            for i in {1..20}; do
              if docker exec db mysqladmin ping -h localhost -u root --password=1234 --silent 2>/dev/null; then
                echo "✅ MySQL is ready!"
                break
              fi
              echo "Waiting for MySQL... ($i/20)"
              sleep 3
            done
            
            # 애플리케이션 헬스체크
            echo "⏳ Checking application health..."
            for i in {1..30}; do
              if curl -f http://localhost:8080/health-check 2>/dev/null; then
                echo "✅ Application is healthy!"
                echo "🌐 Access your app at: http://3.38.180.5:8080/health-check"
                break
              fi
              echo "Waiting for application... ($i/30)"
              sleep 10
            done
            
            # 최종 상태 확인
            echo "📋 Final Status:"
            docker ps
            
            # 애플리케이션 로그 (마지막 10줄)
            echo "📜 Application Logs:"
            docker logs spring-app --tail 10
            
            # 사용하지 않는 이미지 정리
            docker image prune -f
            
            # 보안을 위해 환경변수 파일 삭제
            rm -f .env
            
            echo "🎉 Deployment completed successfully!"
            echo "🔗 Health Check: http://3.38.180.5:8080/health-check"